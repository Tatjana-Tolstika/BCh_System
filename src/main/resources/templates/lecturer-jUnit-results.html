<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>JUnit rezultāti</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        

        .btn-back {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            background-color: #7f8c8d;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-back:hover {
            background-color: #95a5a6;
        }

        .code-wrapper {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
        }

        .code-wrapper pre {
            margin: 0;
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #f8f8f2;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <a class="btn-back"
       th:href="@{/professor/courses/{c}/tests/{t}/students(c=${courseId},t=${testId})}">
       ← Back
    </a>

    <h2>JUnit tests results</h2>

    <div class="code-wrapper">
        <pre th:text="${junitOutput}"></pre>
    </div>

</div>

</body>
</html>
