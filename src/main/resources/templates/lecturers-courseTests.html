<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Course Tests</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
        }

        .btn-back {
            text-decoration: none;
            background-color: #7f8c8d;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #95a5a6;
        }
		
		.btn-add {
	        text-decoration: none;
	        background-color: #7f8c8d;
	        color: white;
	        padding: 8px 15px;
	        border-radius: 6px;
	        font-size: 14px;
	        transition: background 0.2s;
			
	    }
	
	    .btn-add:hover {
	        background-color: #95a5a6;
	    }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead {
            background-color: #2980b9;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
        }

        th {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr {
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* Stils testa nosaukumam (bez linka) */
        .test-name {
            color: #2c3e50;
            font-weight: 500;
        }

        .test-info {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .empty {
            text-align: center;
            color: #999;
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #eee;
            border-radius: 8px;
        }
		.btn-view {
		    text-decoration: none;
		    background-color: #16a085;
		    color: white;
		    padding: 8px 12px;
		    border-radius: 6px;
		    font-size: 13px;
		    transition: background 0.2s;
		    display: inline-block;
		    white-space: nowrap;
		}
		.btn-view:hover {
		    background-color: #1abc9c;
		}
		.students-btn {
		    text-align: right;
		    padding-right: 10px;
		}
    </style>
</head>

<body>

<div class="container">
    <div class="header-area">
        <h1>Course Tests</h1>
		<a class="btn-add" th:href="@{/professor/courses/{courseId}/tests/add(courseId=${courseId})}"> + Add Test </a>
        <a th:href="@{/professor/courses}" class="btn-back">← Back to Courses</a>
    </div>

    <table th:if="${not #lists.isEmpty(allTests)}">
        <thead>
            <tr>
                <th>Test Title</th>
                <th>Details</th>
				<th>Students</th>
				<th>Tasks</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="test : ${allTests}">
                <td>
                    <span class="test-name" th:text="${test.testTitle}"></span>
                </td>
                <td class="test-info">
                    <span th:text="${test.testDescription ?: 'No description available'}"></span>
				</td>
				<td class="students-btn">
			        <a class="btn-view" th:href="@{/professor/courses/{courseId}/tests/{testId}/students(courseId=${courseId}, testId=${test.testId})}">
			            View Students
			        </a>
			    </td>
				<td class="students-btn">
			        <a class="btn-view" th:href="@{/professor/courses/{courseId}/tests/{testId}/tasks(courseId=${courseId}, testId=${test.testId})}">
			            View Tasks
			        </a>
			    </td>
				
            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(allTests)}">
        <p>No tests found for this course.</p>
    </div>
</div>

</body>
</html>
