<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Course Tests</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
        }

        .btn-back {
            text-decoration: none;
            background-color: #7f8c8d;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #95a5a6;
        }
		
		.btn-add {
	        text-decoration: none;
	        background-color: #7f8c8d;
	        color: white;
	        padding: 8px 15px;
	        border-radius: 6px;
	        font-size: 14px;
	        transition: background 0.2s;
			
	    }
	
	    .btn-add:hover {
	        background-color: #95a5a6;
	    }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead {
            background-color: #2980b9;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
        }

        th {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr {
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .test-name {
            color: #2c3e50;
            font-weight: 500;
        }

        .test-info {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .empty {
            text-align: center;
            color: #999;
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #eee;
            border-radius: 8px;
        }
		.btn-view {
		    text-decoration: none;
		    background-color: #16a085;
		    color: white;
		    padding: 8px 12px;
		    border-radius: 6px;
		    font-size: 13px;
		    transition: background 0.2s;
		    display: inline-block;
		    white-space: nowrap;
		}
		.btn-view:hover {
		    background-color: #1abc9c;
		}
		.students-btn {
		    text-align: right;
		    padding-right: 10px;
		}
    </style>
</head>

<body>

<div class="container">
    <div class="header-area">
        <h1>Tests Results</h1>
        <a th:href="@{/student/courses}" class="btn-back">← Back to Courses</a>
		<form th:action="@{/logout}" method="post" style="margin: 0;">
	        <button type="submit" class="btn-logout"> Logout</button>
		</form>
    </div>

    <table th:if="${not #lists.isEmpty(allTests)}">
        <thead>
            <tr>
                <th>Test Title</th>
                <th>Details</th>
				<th>Result</th>
				<th>More</th>
				<th>Upload ZIP</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="test : ${allTests}">
                <td>
                    <span class="test-name" th:text="${test.testTitle}"></span>
                </td>
                <td class="test-info">
                    <span th:text="${test.testDescription ?: 'No description available'}"></span>
				</td>
				<td th:text="${results[test.testId]}"></td>
				<td><a class="btn-view"
	                   th:href="@{/student/courses/{courseId}/tests/{testId}/results(
	                       courseId=${courseId},
	                       testId=${test.testId})}">
	                    View Details
	                </a>
	            </td>
				<td>
                    <form th:action="@{/student/courses/{courseId}/tests/{testId}/upload(courseId=${courseId}, testId=${test.testId})}"
                          method="post"
                          enctype="multipart/form-data">
                        <input type="file" name="file" accept=".zip" required />
                        <button type="submit" class="btn-upload">Upload</button>

                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(allTests)}">
        <p>No tests found for this course.</p>
    </div>
</div>

</body>
</html>
