<html xmlns:th=" https://www.thymeleaf.org">
	
	<body>
	<p>Please enter a new program: </p>
		<form action="#" th:action="@{/programs/crud/add}" th:object="${program}" method="post">
			<table>
				<tr>
					<td>Title: </td>
					<td><input type="text" th:field="*{programTitle}"></td>
					<td th:if="${#fields.hasErrors('programTitle')}" th:errors="*{programTitle}"></td>
				</tr>
					<tr></tr>
					<td>Degree: </td>
					<td><input type="text" th:field="*{programDegree}"></td>
					<td th:if="${#fields.hasErrors('programDegree')}" th:errors="*{programDegree}"></td>
										
				</tr>
					<tr>
					<td>Abbreviation: </td>
					<td><input type="text" th:field="*{abbreviation}"></td>
					<td th:if="${#fields.hasErrors('abbreviation')}" th:errors="*{abbreviation}"></td>
										
				</tr>
				
				<tr>
					<td><input type="submit" name="Save"></td>
				</tr>
				
				
			</table>
		</form>
		
	</body>

</html>
