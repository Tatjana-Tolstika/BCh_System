<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>

<p>Update the information about the program:</p>

<form th:action="@{/programs/crud/update/{id}(id=${program.programId})}"
      th:object="${program}"
      method="post" onsubmit="return validateForm()">

    <input type="hidden" th:field="*{programId}"/>

    <table>
        <tr>
            <td>Title:</td>
            <td>
                <input type="text" th:field="*{programTitle}" id="title"/>
                <div id="titleError" style="color:red; display:none;">Please enter a title (min 3 chars)!</div>
            </td>
            <td th:if="${#fields.hasErrors('programTitle')}" th:errors="*{programTitle}" style="color:red"></td>
        </tr>

        <tr>
            <td>Degree:</td>
            <td>
                <input type="text" th:field="*{programDegree}" id="degree"/>
                <div id="degreeError" style="color:red; display:none;">Please enter the degree!</div>
            </td>
            <td th:if="${#fields.hasErrors('programDegree')}" th:errors="*{programDegree}" style="color:red"></td>
        </tr>

        <tr>
            <td>Abbreviation:</td>
            <td>
                <input type="text" th:field="*{abbreviation}" id="abbr"/>
                <div id="abbrError" style="color:red; display:none;">Please enter the abbreviation!</div>
            </td>
            <td th:if="${#fields.hasErrors('abbreviation')}" th:errors="*{abbreviation}" style="color:red"></td>
        </tr>
		
		<tr>
            <td>Length (years):</td>
            <td>
                <input type="number" th:field="*{length}" id="length"/>
                <div id="lengthError" style="color:red; display:none;">Length must be between 1 and 6!</div>
            </td>
            <td th:if="${#fields.hasErrors('length')}" th:errors="*{length}" style="color:red"></td>
		</tr>

        <tr>
            <td>
                <input type="submit" value="Save"/>
            </td>
        </tr>
    </table>
</form>

<script>
function validateForm() {
    let valid = true;
    
    // Iegūstam elementus
    const title = document.getElementById("title");
    const degree = document.getElementById("degree");
    const abbr = document.getElementById("abbr");
    const length = document.getElementById("length");

    // Title validācija
    if (title.value.trim().length < 3) {
        document.getElementById("titleError").style.display = "block";
        valid = false;
    } else {
        document.getElementById("titleError").style.display = "none";
    }

    // Degree validācija
    if (!degree.value.trim()) {
        document.getElementById("degreeError").style.display = "block";
        valid = false;
    } else {
        document.getElementById("degreeError").style.display = "none";
    }

    // Abbreviation validācija
    if (!abbr.value.trim()) {
        document.getElementById("abbrError").style.display = "block";
        valid = false;
    } else {
        document.getElementById("abbrError").style.display = "none";
    }

    // Length validācija
    const lengthVal = parseInt(length.value);
    if (isNaN(lengthVal) || lengthVal < 1 || lengthVal > 6) {
        document.getElementById("lengthError").style.display = "block";
        valid = false;
    } else {
        document.getElementById("lengthError").style.display = "none";
    }

    return valid; 
}
</script>

</body>
</html>
