<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Test Tasks</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
        }

        .btn-back {
            text-decoration: none;
            background-color: #7f8c8d;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #95a5a6;
        }

		
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead {
            background-color: #2980b9;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            vertical-align: top;
        }

        th {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr {
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .task-desc {
            color: #2c3e50;
            font-weight: 500;
        }

        .task-notes {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .empty {
            text-align: center;
            color: #999;
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #eee;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header-area">
        <h1>Test Tasks</h1>
		<a class="btn-back"
		   th:if="${test.status.name() == 'IN_PROCESS'}"
		   th:href="@{/professor/courses/{courseId}/tests/{testId}/tasks/add(courseId=${courseId}, testId=${testId})}">
		    + Add Task
		</a>
		<a type="button" href="#" class="btn-back" onclick="toggleTotal()">Check points</a>
        <a th:href="@{/professor/courses/{courseId}/tests(courseId=${courseId})}" class="btn-back"> ← Back to Tests</a>
		
    </div>
	<div id="totalBox" class="empty" style="display:none; margin-top: 0;">
	  Total points: <strong th:text="${totalPoints}">0</strong>
	</div>

    <table th:if="${not #lists.isEmpty(allTasks)}">
        <thead>
            <tr>
                <th>Description</th>
                <th>Max Points</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tempTT : ${allTasks}">
                <td class="task-desc" th:text="${tempTT.taskDescription}"></td>
                <td th:text="${tempTT.maxPoints}"></td>
                <td class="task-notes" th:text="${tempTT.taskNotes ?: '—'}"></td>
            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(allTasks)}">
        <p>No tasks found for this test.</p>
    </div>
</div>

</body>
<script>
	function toggleTotal() {
	  const box = document.getElementById("totalBox");
	  box.style.display = (box.style.display === "none") ? "block" : "none";
	}
</script>
</html>
