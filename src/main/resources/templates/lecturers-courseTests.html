<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Course Tests</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
            flex-wrap: wrap;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
        }

        .btn-back {
            text-decoration: none;
            background-color: #7f8c8d;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #95a5a6;
        }

        .btn-add {
            text-decoration: none;
            background-color: #27ae60;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #229954;
        }

        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .btn-logout:hover {
            background-color: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead {
            background-color: #2980b9;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr {
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #eaf4fb;
        }

        .test-name {
            color: #2c3e50;
            font-weight: 600;
        }

        .test-info {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .empty {
            text-align: center;
            color: #999;
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #eee;
            border-radius: 8px;
        }

        .btn-view {
            text-decoration: none;
            background-color: #2980b9;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: background 0.2s;
            display: inline-block;
            white-space: nowrap;
        }

        .btn-view:hover {
            background-color: #3498db;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-published {
            background-color: #e8f8f1;
            color: #1e8449;
        }

        .status-in-process {
            background-color: #fef5e7;
            color: #ca6f1e;
        }

        .action-cell form {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-cell input[type="datetime-local"] {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f9f9f9;
            color: #2c3e50;
        }

        .btn-toggle {
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .btn-publish {
            background-color: #27ae60;
        }

        .btn-publish:hover {
            background-color: #229954;
        }

        .btn-unpublish {
            background-color: #c0392b;
        }

        .btn-unpublish:hover {
            background-color: #a93226;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header-area">
        <h1>Course Tests</h1>
        <a class="btn-add" th:href="@{/professor/courses/{courseId}/tests/add(courseId=${courseId})}">+ Add Test</a>
        <a th:href="@{/professor/courses}" class="btn-back">← Back to Courses</a>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>

    <div th:if="${errorMsg}"
         style="background-color:#fdecea; color:#c0392b; padding:12px; border-radius:8px; margin-bottom:15px;">
        <span th:text="${errorMsg}"></span>
    </div>

    <table th:if="${not #lists.isEmpty(allTests)}">
        <thead>
            <tr>
                <th>Test Title</th>
                <th>Details</th>
                <th>Students</th>
                <th>Tasks</th>
                <th>Status</th>
                <th>Publish / Unpublish</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="test : ${allTests}">
                <td>
                    <span class="test-name" th:text="${test.testTitle}"></span>
                </td>

                <td class="test-info">
                    <span th:text="${test.testDescription ?: 'No description available'}"></span>
                </td>

                <td>
                    <a class="btn-view"
                       th:href="@{/professor/courses/{courseId}/tests/{testId}/students(courseId=${courseId}, testId=${test.testId})}">
                        View Students
                    </a>
                </td>

                <td>
                    <a class="btn-view"
                       th:href="@{/professor/courses/{courseId}/tests/{testId}/tasks(courseId=${courseId}, testId=${test.testId})}">
                        View Tasks
                    </a>
                </td>

                <td>
                    <span class="status-badge"
                          th:classappend="${test.status.name() == 'PUBLISHED'} ? ' status-published' : ' status-in-process'"
                          th:text="${test.status}">
                    </span>
                </td>

                <td class="action-cell">
                    <form th:action="@{/professor/courses/{courseId}/tests/{testId}/status(courseId=${courseId}, testId=${test.testId})}"
                          method="post">

                        <!-- If test is NOT published -->
                        <div th:if="${test.status.name() == 'IN_PROCESS'}">
                            <input type="datetime-local" name="deadline" required />
                        </div>

                        <!-- If test IS published -->
                        <div th:if="${test.status.name() == 'PUBLISHED'}">
                            <input type="datetime-local"
                                   name="deadline"
                                   th:value="${#temporals.format(test.deadline, 'yyyy-MM-dd HH:mm')}" />
                        </div>

                        <button type="submit"
                                class="btn-toggle"
                                th:classappend="${test.status.name() == 'PUBLISHED'} ? ' btn-unpublish' : ' btn-publish'"
                                th:text="${test.status.name() == 'PUBLISHED'} ? 'Unpublish' : 'Publish'">
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(allTests)}">
        <p>No tests found for this course.</p>
    </div>
</div>

</body>
</html>
