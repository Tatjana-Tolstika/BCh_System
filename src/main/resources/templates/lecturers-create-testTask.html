<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Create Task</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 12px;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
        }

        .subtitle {
            color: #7f8c8d;
            margin: 10px 0 0 0;
            font-size: 0.95em;
        }

        .btn-back {
            text-decoration: none;
            background-color: #7f8c8d;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-back:hover {
            background-color: #95a5a6;
        }

        .form-grid {
            width: 100%;
            border-collapse: collapse;
        }

        .label {
            width: 180px;
            font-weight: 600;
            color: #2c3e50;
            padding: 12px 10px 12px 0;
            vertical-align: top;
        }

        .field {
            padding: 12px 0;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            max-width: 520px;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #2980b9;
            box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.15);
        }

        .hint {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 6px;
        }

        .error {
            color: #c0392b;
            font-size: 0.9em;
            margin-top: 6px;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-primary {
            border: none;
            background-color: #2980b9;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #1f6a97;
        }

        .btn-secondary {
            text-decoration: none;
            display: inline-block;
            background-color: #ecf0f1;
            color: #2c3e50;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background-color: #e1e6e8;
        }

        .test-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #ecf0f1;
            color: #2c3e50;
            font-size: 0.9em;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header-area">
        <div>
            <h1>Create New Task</h1>
            <p class="subtitle">
                For test:
                <span class="test-badge" th:text="${testFind.testTitle}">Test Title</span>
            </p>
        </div>

        <a class="btn-back"
           th:href="@{/professor/courses/{courseId}/tests/{testId}/tasks(courseId=${courseId}, testId=${testId})}">
            ← Back to Tasks
        </a>
    </div>

    <form th:action="@{/professor/courses/{courseId}/tests/{testId}/tasks/add(courseId=${courseId}, testId=${testId})}"
          th:object="${testTask}"
          method="post"
          onsubmit="return validateForm();">

        <table class="form-grid">
            <!-- Description -->
            <tr>
                <td class="label">Description</td>
                <td class="field">
                    <input type="text" th:field="*{taskDescription}" id="taskDescription">
                    <div class="hint">Min 5 characters</div>

                    <div id="descError" class="error" style="display:none;">
                        Please enter a description (min 5 chars)!
                    </div>
                    <div th:if="${#fields.hasErrors('taskDescription')}"
                         th:errors="*{taskDescription}"
                         class="error"></div>
                </td>
            </tr>

            <!-- Max Points -->
            <tr>
                <td class="label">Max points</td>
                <td class="field">
                    <input type="number" th:field="*{maxPoints}" id="maxPoints" min="0.1" step="0.1">
                    <div class="hint">Must be > 0</div>

                    <div id="pointsError" class="error" style="display:none;">
                        Please enter max points (>0)!
                    </div>
                    <div th:if="${#fields.hasErrors('maxPoints')}"
                         th:errors="*{maxPoints}"
                         class="error"></div>
                </td>
            </tr>

            <!-- Notes -->
            <tr>
                <td class="label">Notes</td>
                <td class="field">
                    <input type="text" th:field="*{taskNotes}" id="taskNotes">
                    <div class="hint">Optional</div>

                    <div th:if="${#fields.hasErrors('taskNotes')}"
                         th:errors="*{taskNotes}"
                         class="error"></div>
                </td>
            </tr>
        </table>

        <div class="actions">
            <a th:href="@{/professor/courses/{courseId}/tests/{testId}/tasks(courseId=${courseId}, testId=${testId})}"
               class="btn-secondary">
                Cancel
            </a>
            <button type="submit" class="btn-primary">Save</button>
        </div>
    </form>
</div>

<script>
function validateForm() {
    let valid = true;

    const desc = document.getElementById("taskDescription");
    const points = document.getElementById("maxPoints");

    if (!desc.value.trim() || desc.value.trim().length < 5) {
        document.getElementById("descError").style.display = "block";
        valid = false;
    } else {
        document.getElementById("descError").style.display = "none";
    }

    const pointsValue = parseFloat(points.value, 10);
    if (isNaN(pointsValue) || pointsValue <= 0) {
        document.getElementById("pointsError").style.display = "block";
        valid = false;
    } else {
        document.getElementById("pointsError").style.display = "none";
    }

    return valid;
}
</script>

</body>
</html>
