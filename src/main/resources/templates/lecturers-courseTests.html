<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Course Tests</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Header  */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
            flex-wrap: wrap;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
            flex: 1;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        /*button */
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-family: "Segoe UI", Arial, sans-serif;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-back    { background-color: #7f8c8d; color: white; }
        .btn-back:hover { background-color: #95a5a6; }

        .btn-add     { background-color: #27ae60; color: white; }
        .btn-add:hover { background-color: #229954; }

        .btn-logout  { background-color: #e74c3c; color: white; }
        .btn-logout:hover { background-color: #c0392b; }

        .btn-view    { background-color: #2980b9; color: white; font-size: 13px; padding: 6px 12px; }
        .btn-view:hover { background-color: #3498db; }

        .btn-publish   { background-color: #27ae60; color: white; font-size: 13px; padding: 6px 12px; }
        .btn-publish:hover { background-color: #229954; }

        .btn-unpublish { background-color: #c0392b; color: white; font-size: 13px; padding: 6px 12px; }
        .btn-unpublish:hover { background-color: #a93226; }

        .btn-upload  { background-color: #8e44ad; color: white; font-size: 13px; padding: 6px 12px; }
        .btn-upload:hover { background-color: #7d3c98; }

        /*  Table  */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead { background-color: #2980b9; color: white; }

        th, td {
            padding: 12px 15px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr { border-bottom: 1px solid #ddd; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #eaf4fb; }

        .test-name { color: #2c3e50; font-weight: 600; }
        .test-info { color: #7f8c8d; font-size: 0.9em; }

        /* Status */
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-published  { background-color: #e8f8f1; color: #1e8449; }
        .status-in-process { background-color: #fef5e7; color: #ca6f1e; }

        /* Publish form*/
        .publish-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .publish-form input[type="datetime-local"] {
            padding: 5px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f9f9f9;
            color: #2c3e50;
            width: 170px;
        }

        /*Upload form */
        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .upload-form input[type="file"] {
            font-size: 12px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #2c3e50;
            max-width: 160px;
        }

        .empty {
            text-align: center;
            color: #999;
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #eee;
            border-radius: 8px;
        }

        .error-banner {
            background-color: #fdecea;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header-area">
        <h1>Course Tests</h1>
        <div class="header-buttons">
            <a class="btn btn-add"
               th:href="@{/professor/courses/{courseId}/tests/add(courseId=${courseId})}">+ Add Test</a>
            <a class="btn btn-back"
               th:href="@{/professor/courses}">← Back to Courses</a>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="btn btn-logout">Logout</button>
            </form>
        </div>
    </div>

    <div class="error-banner" th:if="${errorMsg}">
        <span th:text="${errorMsg}"></span>
    </div>

    <table th:if="${not #lists.isEmpty(allTests)}">
        <thead>
            <tr>
                <th>Test Title</th>
                <th>Details</th>
                <th>Students</th>
                <th>Tasks</th>
                <th>Status</th>
                <th>Publish / Unpublish</th>
                <th>Statistics</th>
                <th>jUnit</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="test : ${allTests}">

                <td><span class="test-name" th:text="${test.testTitle}"></span></td>

                <td class="test-info">
                    <span th:text="${test.testDescription ?: 'No description available'}"></span>
                </td>

                <td>
                    <a class="btn btn-view"
                       th:href="@{/professor/courses/{courseId}/tests/{testId}/students(
                           courseId=${courseId}, testId=${test.testId})}">
                        View Students
                    </a>
                </td>

                <td>
                    <a class="btn btn-view"
                       th:href="@{/professor/courses/{courseId}/tests/{testId}/tasks(
                           courseId=${courseId}, testId=${test.testId})}">
                        View Tasks
                    </a>
                </td>

                <td>
                    <span class="status-badge"
                          th:classappend="${test.status.name() == 'PUBLISHED'} ? ' status-published' : ' status-in-process'"
                          th:text="${test.status}">
                    </span>
                </td>

                <td>
                    <form class="publish-form"
                          th:action="@{/professor/courses/{courseId}/tests/{testId}/status(
                              courseId=${courseId}, testId=${test.testId})}"
                          method="post">

                        <input type="datetime-local" name="deadline"
                               th:required="${test.status.name() == 'IN_PROCESS'}"
                               th:value="${test.status.name() == 'PUBLISHED'} ?
                                   ${#temporals.format(test.deadline, 'yyyy-MM-dd HH:mm')} : ''" />

                        <button type="submit"
                                class="btn"
                                th:classappend="${test.status.name() == 'PUBLISHED'} ? ' btn-unpublish' : ' btn-publish'"
                                th:text="${test.status.name() == 'PUBLISHED'} ? 'Unpublish' : 'Publish'">
                        </button>
                    </form>
                </td>

                <td>
                    <a class="btn btn-view"
                       th:href="@{/professor/courses/{courseId}/tests/{testId}/stats(
                           courseId=${courseId}, testId=${test.testId})}">
                        View Stats
                    </a>
                </td>

                <td>
                    <form class="upload-form"
                          th:action="@{/professor/courses/{courseId}/tests/{testId}/upload-tests(
                              courseId=${courseId}, testId=${test.testId})}"
                          method="post" enctype="multipart/form-data">
                        <input type="file" name="file" accept=".zip" required />
                        <button type="submit" class="btn btn-upload">Upload</button>
                    </form>
					
                </td>
				

            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(allTests)}">
        <p>No tests found for this course.</p>
    </div>

</div>

</body>
</html>
