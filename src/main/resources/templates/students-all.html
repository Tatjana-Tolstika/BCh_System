<html xmlns:th="https://www.thymeleaf.org">
	<body>
		<p>Students: </p>
		<table border="1px">
			<tr th:each="tempS: ${students}">
			
				<!-- <td th:text = "${tempS.getStudentId()}"></td> -->
				<td th:text = "${tempS.getStudentName()}"></td>
				<td th:text = "${tempS.getStudentSurname()}"></td>
				<td th:text = "${tempS.getMatriculationNr()}"></td>
				<td th:text = "${tempS.getEmail()}"></td>
			</tr>
		</table>
	</body>	


</html>
