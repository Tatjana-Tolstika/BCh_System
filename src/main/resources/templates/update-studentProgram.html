<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>

	<p>
	    Update the information about the program:
	</p>
	<form th:action="@{/studentProgram/crud/update/{spId}(spId=${studentProgram.studentProgramId})}"
	      th:object="${studentProgram}"
	      method="post" onsubmit="return validateForm()">

	<input type="hidden" id="programLength" th:value="${programLength}">
	<input type="hidden" th:field="*{student.studentId}" th:value="${studentProgram.student.studentId}"> <!-- To get studentID without changing it-->
    <table>

		<p>
		    Student:
		    <strong th:text="${studentProgram.student.studentName + ' ' + studentProgram.student.studentSurname}"></strong>
		</p>
		
		<tr>
		    <td>Program:</td>
		    <td>
				<select th:field="*{studyProgram.programId}" id="programSelect">
				    <option th:each="p : ${programs}"
				            th:value="${p.programId}"
				            th:text="${p.programTitle}"
				            th:selected="${p.programId == studentProgram.studyProgram.programId}">
				    </option>
				</select>
		    </td>
		</tr>

        <tr>
            <td>Courses:</td>
            <td><input type="text" th:field="*{course}"/>
				<div id="courseError" style="color:red; display:none">Please enter a correct course!</div>
			</td>
            <td th:if="${#fields.hasErrors('course')}"
                th:errors="*{course}"></td>
        </tr>

        <tr>
            <td>
                <input type="submit" value="Save"/>
            </td>
        </tr>
    </table>
 
</form>
<script>
function validateForm() {
    const course = parseInt(document.getElementById("course").value);
    const programLength = parseInt(document.getElementById("programLength").value);

    if (course <= 0 || course > programLength) {
        document.getElementById("courseError").style.display = "block";
        return false; // Forma NETIKS nosūtīta
    }
    
    document.getElementById("courseError").style.display = "none";
    return true; // Forma tiks nosūtīta
}
</script>

</body>
</html>
