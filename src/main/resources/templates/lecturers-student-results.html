<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Student Test Results</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-back {
            text-decoration: none;
            background-color: #7f8c8d;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
            display: inline-block;
            white-space: nowrap;
        }

        .btn-back:hover {
            background-color: #95a5a6;
        }

        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .btn-logout:hover {
            background-color: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead {
            background-color: #2980b9;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr {
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #eaf4fb;
        }

        .task-desc {
            color: #2c3e50;
            font-weight: 600;
        }

        .notes {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .empty {
            text-align: center;
            color: #999;
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #eee;
            border-radius: 8px;
        }

        .actions-col {
            white-space: nowrap;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-edit {
            text-decoration: none;
            background-color: #16a085;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: background 0.2s;
            display: inline-block;
            white-space: nowrap;
        }

        .btn-edit:hover {
            background-color: #1abc9c;
        }

        .btn-view {
            text-decoration: none;
            background-color: #2980b9;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: background 0.2s;
            display: inline-block;
            white-space: nowrap;
        }

        .btn-view:hover {
            background-color: #3498db;
        }

        .points-badge {
            display: inline-block;
            background-color: #eaf4fb;
            color: #1a5276;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .minus-badge {
            display: inline-block;
            background-color: #fdecea;
            color: #a93226;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header-area">
        <h1 th:text="${studentFind.studentName + ' ' + studentFind.studentSurname + ' Results'}"></h1>

        <div class="header-actions">
            <a class="btn-back"
               th:href="@{/professor/courses/{courseId}/tests/{testId}/students(courseId=${courseId}, testId=${testId})}">
                ← Back to Students
            </a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>

    <table th:if="${not #lists.isEmpty(studentResults)}">
        <thead>
            <tr>
                <th>Task</th>
                <th>Max Points</th>
                <th>Comments</th>
                <th>Minus</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="res : ${studentResults}">
                <td class="task-desc" th:text="${res.task.taskDescription}"></td>

                <td>
                    <span class="points-badge" th:text="${res.task.maxPoints}"></span>
                </td>

                <td class="notes" th:text="${res.comments ?: '—'}"></td>

                <td>
                    <span class="minus-badge" th:text="${res.minus}"></span>
                </td>

                <td class="actions-col">
                    <a class="btn-edit"
                       th:href="@{/professor/courses/{courseId}/tests/{testId}/students/{studentId}/results/{resultId}/update(
                           courseId=${courseId},
                           testId=${testId},
                           studentId=${studentId},
                           resultId=${res.resultId})}">
                        Edit
                    </a>
                    <a class="btn-view"
                       th:href="@{/professor/courses/{courseId}/tests/{testId}/student/{studentId}/files(
                           courseId=${courseId},
                           testId=${testId},
                           studentId=${studentId})}">
                        Files
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(studentResults)}">
        <p>No detailed results found for this student.</p>
    </div>
</div>

</body>
</html>
